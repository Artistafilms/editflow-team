<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EditFlow — Team Video Production Tracker</title>
<style>
  :root{--bg:#0b0e13;--panel:#141923;--panel2:#1a2030;--line:#283143;--text:#eef2fa;--muted:#94a0b5;--purple:#a78bfa;--cyan:#37d7d0;--amber:#fbbf24;--red:#fb7185;--green:#4ade80}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif} button,input,select,textarea{font:inherit} button{cursor:pointer;border:0;color:inherit}
  header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--line);background:#0e121a;position:sticky;top:0;z-index:4}.brand{font-size:21px;font-weight:800;letter-spacing:-.5px}.brand i{color:var(--purple);font-style:normal}.top-actions{display:flex;gap:9px;align-items:center}.btn{background:#252d3d;padding:10px 13px;border-radius:8px;font-weight:650}.btn:hover{filter:brightness(1.18)}.primary{background:var(--purple);color:#171226}.ghost{background:transparent;color:var(--muted)}
  main{max-width:1440px;margin:auto;padding:28px 32px 64px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.intro h1{margin:0;font-size:28px;letter-spacing:-.8px}.intro p{margin:7px 0 0;color:var(--muted)}.today{color:var(--muted);font-weight:600}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}.metric{background:linear-gradient(135deg,var(--panel),#121826);padding:18px;border:1px solid var(--line);border-radius:12px}.metric label{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}.metric strong{display:block;font-size:30px;margin:8px 0 3px}.metric span{font-size:12px;color:var(--muted)}.metric .up{color:var(--green)}.metric .warn{color:var(--amber)}
  .layout{display:grid;grid-template-columns:1fr 290px;gap:18px}.board{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}.board-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 17px;border-bottom:1px solid var(--line)}.board-head h2,.side h2{font-size:15px;margin:0}.filters{display:flex;gap:8px}.filters select{background:#202838;border:1px solid #344059;border-radius:7px;color:var(--text);padding:7px}.kanban{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:1px;background:var(--line);min-height:490px}.column{background:#111722;padding:12px}.col-title{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 13px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}.count{background:#252d3b;padding:2px 7px;border-radius:20px;color:#c9d1df}.cards{min-height:420px}.card{background:var(--panel2);border:1px solid #2b3548;border-radius:9px;padding:12px;margin-bottom:10px;box-shadow:0 4px 14px #05070a33;cursor:pointer}.card:hover{border-color:#57657e}.card h3{font-size:13px;margin:0 0 10px;line-height:1.35}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.avatar{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;background:#3c3561;color:#ddd5ff;font-weight:800;font-size:10px}.tag{font-size:10px;font-weight:800;border-radius:12px;padding:4px 7px;text-transform:uppercase;letter-spacing:.3px}.tag.high{background:#4a2131;color:#fda4af}.tag.medium{background:#4b3c19;color:#fcd34d}.tag.low{background:#183d35;color:#75e6d4}.progress{height:4px;background:#30394c;border-radius:3px;overflow:hidden;margin:11px 0}.progress b{display:block;background:var(--cyan);height:100%}
  .side{display:flex;flex-direction:column;gap:18px}.side section{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px}.team-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #242d3d}.team-row:last-child{border:0;padding-bottom:0}.person{flex:1}.person b{display:block;font-size:13px}.person span{font-size:12px;color:var(--muted)}.load{font-size:12px;font-weight:700;color:var(--cyan)}.deadline{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #242d3d}.deadline:last-child{border:0;padding-bottom:0}.date{background:#29203d;color:#cbbbff;border-radius:7px;padding:6px 7px;font-size:11px;font-weight:800;height:fit-content}.deadline b{display:block;font-size:13px}.deadline span{font-size:12px;color:var(--muted)}
  dialog{width:min(570px,calc(100% - 30px));border:1px solid #45536c;border-radius:14px;background:#171e2c;color:var(--text);padding:0;box-shadow:0 24px 80px #0009}dialog::backdrop{background:#000a}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:18px}.x{font-size:21px;background:transparent;color:var(--muted)}form{padding:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:block;color:#b7c0d1;font-weight:700;font-size:12px;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #3a465c;border-radius:7px;background:#0e1420;color:var(--text)}textarea{height:88px;resize:vertical}.form-actions{display:flex;justify-content:space-between;margin-top:18px}.right{display:flex;gap:8px}.delete{background:#4a2030;color:#fda4af}.empty{color:var(--muted);font-size:12px;text-align:center;padding:40px 10px;border:1px dashed #344057;border-radius:8px}
  @media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.kanban{overflow-x:auto}.column{min-width:210px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){header,main{padding-left:15px;padding-right:15px}.top-actions .ghost{display:none}.intro{align-items:start;flex-direction:column;gap:8px}.metrics,.side{grid-template-columns:1fr}.board-head{align-items:start;flex-direction:column}.kanban{grid-template-columns:repeat(4,210px)}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="authGate" style="display:none"></div>
<header><div class="brand">Edit<i>Flow</i></div><div class="top-actions"><span id="userLabel" style="color:var(--muted);font-size:12px"></span><button id="signOutButton" class="btn ghost" onclick="signOut()" hidden>Sign out</button><button id="reminderButton" class="btn ghost" onclick="enableReminders()">Enable reminders</button><button class="btn ghost" onclick="document.getElementById('importFile').click()">Import backup</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><button class="btn ghost" onclick="exportData()">Export backup</button><button class="btn primary" onclick="openNew()">+ New video</button></div></header>
<main><div class="intro"><div><h1>Production overview</h1><p>Keep every cut, review, and deadline moving forward.</p></div><div class="today" id="today"></div></div>
<div class="metrics"><div class="metric"><label>Active videos</label><strong id="activeN">0</strong><span>in production</span></div><div class="metric"><label>Completed</label><strong id="doneN">0</strong><span class="up">ready to publish</span></div><div class="metric"><label>Due this week</label><strong id="dueN">0</strong><span class="warn">needs attention</span></div><div class="metric"><label>Team capacity</label><strong id="capacity">—</strong><span>average completion</span></div></div>
<div class="layout"><section class="board"><div class="board-head"><h2>Editing pipeline</h2><div class="filters"><select id="filterPerson" onchange="render()"><option value="">All editors</option></select><select id="filterPriority" onchange="render()"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div></div><div class="kanban" id="board"></div></section>
<aside class="side"><section><h2>Team workload</h2><div id="team"></div></section><section><h2>Upcoming deadlines</h2><div id="deadlines"></div></section></aside></div></main>
<dialog id="editor"><div class="dialog-head"><h2 id="dialogTitle">New video</h2><button class="x" onclick="closeDialog()">×</button></div><form onsubmit="saveVideo(event)"><div class="fields"><div class="full"><label>Video title</label><input id="title" required placeholder="e.g. Product launch — hero film"></div><div><label>Client</label><input id="client" list="clients" required placeholder="Choose or type a client"><datalist id="clients"><option>Photosnap</option><option>Wedding Chroicle</option><option>Silvion</option><option>Wedding Focus</option><option>Arafat Shohag</option><option>Shohag WC</option><option>Shadows moments</option><option>EGM Arup</option><option>Artmaer</option><option>Abir babuji</option></datalist></div><div><label>Editor</label><input id="assignee" list="people" required placeholder="Name"><datalist id="people"><option>Showrov</option><option>Nikunjo</option><option>Roshni</option></datalist></div><div><label>Due date</label><input id="due" type="date" required></div><div><label>Stage</label><select id="stage"><option>Brief</option><option>Editing</option><option>Review</option><option>Delivered</option></select></div><div><label>Payment status</label><select id="paymentStatus"><option>Due</option><option>Advance</option><option>Full paid</option></select></div><div><label>Payment method</label><select id="paymentMethod"><option>Bkash</option><option>Nagad</option><option>Bank</option></select></div><div><label>Amount</label><input id="amount" type="number" min="0" step="0.01" value="0" placeholder="0.00"></div><div><label>Priority</label><select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></div><div class="full"><label>Progress <span id="progressValue">0%</span></label><input id="progressInput" type="range" min="0" max="100" value="0" oninput="progressValue.textContent=this.value+'%'"></div><div class="full"><label>Notes / next step</label><textarea id="notes" placeholder="What needs to happen next?"></textarea></div></div><div class="form-actions"><button type="button" id="deleteBtn" class="btn delete" onclick="deleteVideo()" hidden>Delete</button><div class="right"><button type="button" class="btn" onclick="closeDialog()">Cancel</button><button class="btn primary">Save video</button></div></div></form></dialog>
<script>
const KEY='editflow-v1';
const SUPABASE_URL='https://lgbwkeffdrouztpdshel.supabase.co';
const SUPABASE_KEY='sb_publishable_cWbX7p9PsaF568pk1MMVdw_-Wx8COqV';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let editingId=null, currentUser=null, videos=[];
const initial=[
 {id:1,title:'Brand story — director’s cut',client:'Photosnap',assignee:'Showrov',due:'2026-09-22',stage:'Editing',priority:'High',progress:65,notes:'Tighten the opening montage.'},
 {id:2,title:'Creator spotlight: Maya',client:'Wedding Chroicle',assignee:'Nikunjo',due:'2026-09-20',stage:'Review',priority:'High',progress:90,notes:'Awaiting client notes.'},
 {id:3,title:'Social cutdowns — September',client:'Silvion',assignee:'Roshni',due:'2026-09-25',stage:'Brief',priority:'Medium',progress:15,notes:'Footage arrives Monday.'},
 {id:4,title:'Tutorial: workspace setup',client:'Wedding Focus',assignee:'Roshni',due:'2026-09-18',stage:'Delivered',priority:'Low',progress:100,notes:'Scheduled for publishing.'},
 {id:5,title:'Launch teaser (15 sec)',client:'Arafat Shohag',assignee:'Showrov',due:'2026-09-24',stage:'Editing',priority:'Medium',progress:42,notes:'Build sound design pass.'}
];
/* The starter records remain as an offline reference only; shared records load from Supabase. */
const stages=['Brief','Editing','Review','Delivered'];
function fromDb(v){return {id:v.id,title:v.title,client:v.client,assignee:v.assignee,due:v.due,stage:v.stage,priority:v.priority,progress:v.progress,notes:v.notes||'',paymentStatus:v.payment_status,paymentMethod:v.payment_method,amount:Number(v.amount)||0}}
function toDb(v){return {title:v.title,client:v.client,assignee:v.assignee,due:v.due,stage:v.stage,priority:v.priority,progress:v.progress,notes:v.notes||'',payment_status:v.paymentStatus,payment_method:v.paymentMethod,amount:v.amount}}
async function loadVideos(){let {data,error}=await db.from('videos').select('*').order('due');if(error){alert('Could not load the shared board: '+error.message);return}videos=(data||[]).map(fromDb);render()}
async function startApp(){authGate.style.display='none';await loadVideos();db.channel('editflow-live').on('postgres_changes',{event:'*',schema:'public',table:'videos'},()=>loadVideos()).subscribe()}
async function sendMagicLink(){let email=loginEmail.value.trim();if(!email){loginStatus.textContent='Enter your approved team email address.';return}loginStatus.textContent='Sending your sign-in link…';let {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.origin+window.location.pathname}});loginStatus.textContent=error?error.message:'Check your email for the sign-in link. Return here after opening it.'}
async function signOut(){await db.auth.signOut();location.reload()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initials(n){return n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function dayDiff(date){return Math.ceil((new Date(date+'T23:59:59')-new Date())/86400000)}
function render(){const person=document.getElementById('filterPerson').value, priority=document.getElementById('filterPriority').value;let filtered=videos.filter(v=>(!person||v.assignee===person)&&(!priority||v.priority===priority));document.getElementById('board').innerHTML=stages.map(stage=>{let vs=filtered.filter(v=>v.stage===stage);return `<div class="column"><div class="col-title"><span>${stage}</span><span class="count">${vs.length}</span></div><div class="cards">${vs.length?vs.map(card).join(''):'<div class="empty">Nothing here yet</div>'}</div></div>`}).join('');
let active=videos.filter(v=>v.stage!=='Delivered').length, done=videos.filter(v=>v.stage==='Delivered').length, due=videos.filter(v=>v.stage!=='Delivered'&&dayDiff(v.due)>=0&&dayDiff(v.due)<=7).length;activeN.textContent=active;doneN.textContent=done;dueN.textContent=due;capacity.textContent=active?Math.round(videos.filter(v=>v.stage!=='Delivered').reduce((a,v)=>a+v.progress,0)/active)+'%':'—';
let people=[...new Set(videos.map(v=>v.assignee))];filterPerson.innerHTML='<option value="">All editors</option>'+people.map(p=>`<option ${p===person?'selected':''}>${esc(p)}</option>`).join('');team.innerHTML=people.length?people.map(p=>{let x=videos.filter(v=>v.assignee===p&&v.stage!=='Delivered');return `<div class="team-row"><span class="avatar">${initials(p)}</span><div class="person"><b>${esc(p)}</b><span>${x.length} active video${x.length===1?'':'s'}</span></div><span class="load">${x.length?Math.round(x.reduce((a,v)=>a+v.progress,0)/x.length)+'%':'Free'}</span></div>`}).join(''):'<div class="empty">Add your first editor</div>';
let upcoming=videos.filter(v=>v.stage!=='Delivered').sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4);deadlines.innerHTML=upcoming.length?upcoming.map(v=>{let d=new Date(v.due+'T12:00:00');return `<div class="deadline"><span class="date">${d.toLocaleDateString(undefined,{month:'short',day:'numeric'}).toUpperCase()}</span><div><b>${esc(v.title)}</b><span>${esc(v.assignee)} · ${dayDiff(v.due)<0?'Overdue':dayDiff(v.due)===0?'Due today':dayDiff(v.due)+' days left'}</span></div></div>`}).join(''):'<div class="empty">No active deadlines</div>'}
function card(v){let paymentClass=v.paymentStatus==='Full paid'?'low':v.paymentStatus==='Advance'?'medium':'high';return `<article class="card" onclick="editVideo(${v.id})"><h3>${esc(v.title)}</h3><div class="meta"><span class="tag low">${esc(v.client||'No client')}</span><span>${new Date(v.due+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></div><div class="meta" style="margin-top:8px"><span class="tag ${v.priority.toLowerCase()}">${v.priority}</span><span class="tag ${paymentClass}">${esc(v.paymentStatus||'Due')} · ${Number(v.amount||0).toLocaleString()}</span></div><div class="meta" style="margin-top:8px"><span>${esc(v.paymentMethod||'Bkash')}</span><span></span></div><div class="progress"><b style="width:${v.progress}%"></b></div><div class="meta"><span>${v.progress}% complete</span><span class="avatar">${initials(v.assignee)}</span></div></article>`}
function persist(){render()}
function openNew(){editingId=null;dialogTitle.textContent='New video';document.querySelector('form').reset();due.value=new Date().toISOString().slice(0,10);progressInput.value=0;progressValue.textContent='0%';deleteBtn.hidden=true;editor.showModal()}
function editVideo(id){let v=videos.find(x=>x.id===id);editingId=id;dialogTitle.textContent='Edit video';title.value=v.title;client.value=v.client||'';assignee.value=v.assignee;due.value=v.due;stage.value=v.stage;paymentStatus.value=v.paymentStatus||'Due';paymentMethod.value=v.paymentMethod||'Bkash';amount.value=v.amount||0;priority.value=v.priority;progressInput.value=v.progress;progressValue.textContent=v.progress+'%';notes.value=v.notes||'';deleteBtn.hidden=false;editor.showModal()}
function closeDialog(){editor.close()}
async function saveVideo(e){e.preventDefault();let data={title:title.value.trim(),client:client.value.trim(),assignee:assignee.value.trim(),due:due.value,stage:stage.value,paymentStatus:paymentStatus.value,paymentMethod:paymentMethod.value,amount:+amount.value||0,priority:priority.value,progress:+progressInput.value,notes:notes.value.trim()};let request=editingId?db.from('videos').update(toDb(data)).eq('id',editingId):db.from('videos').insert(toDb(data));let {error}=await request;if(error){alert('Could not save this video: '+error.message);return}closeDialog();await loadVideos()}
async function deleteVideo(){if(confirm('Delete this video from the tracker?')){let {error}=await db.from('videos').delete().eq('id',editingId);if(error){alert('Could not delete this video: '+error.message);return}closeDialog();await loadVideos()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(videos,null,2)],{type:'application/json'}));a.download='editflow-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){alert('Importing backups is disabled in the shared version. Add videos directly so your team sees each update.');e.target.value=''}
function updateReminderButton(){if(!('Notification' in window)){reminderButton.textContent='Reminders unavailable';reminderButton.disabled=true;return}if(Notification.permission==='granted'){reminderButton.textContent='Reminders enabled';reminderButton.classList.remove('ghost');reminderButton.classList.add('primary')}else if(Notification.permission==='denied'){reminderButton.textContent='Reminders blocked';reminderButton.disabled=true}}
async function enableReminders(){if(!('Notification' in window)){alert('This browser does not support desktop notifications.');return}let permission=await Notification.requestPermission();updateReminderButton();if(permission==='granted'){checkDeadlines(true)}else if(permission==='denied'){alert('Notifications are blocked. Enable them in your browser settings if you change your mind.')}}
function checkDeadlines(sendTest=false){if(!('Notification' in window)||Notification.permission!=='granted')return;let today=new Date().toISOString().slice(0,10);let relevant=videos.filter(v=>v.stage!=='Delivered'&&dayDiff(v.due)<=2);if(sendTest)new Notification('EditFlow reminders are on',{body:relevant.length?`${relevant.length} deadline${relevant.length===1?'':'s'} need attention.`:'No deadlines need attention right now.'});relevant.forEach(v=>{let key=`editflow-reminder-${v.id}-${today}`;if(localStorage.getItem(key))return;let days=dayDiff(v.due), timing=days<0?`${Math.abs(days)} day${Math.abs(days)===1?'':'s'} overdue`:days===0?'due today':`due in ${days} day${days===1?'':'s'}`;new Notification(`Deadline: ${v.title}`,{body:`${v.client||'Client'} · ${v.assignee} · ${timing}`});localStorage.setItem(key,'1')})}
today.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});startApp();
updateReminderButton();checkDeadlines();setInterval(checkDeadlines,60*60*1000);
</script></body></html>
